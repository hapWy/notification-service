app:
  name: "notification-service"
  host: "0.0.0.0"
  grpc_port: 50051
  http_port: 8080
  env: "development"  

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "notification_db"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  stream_name: "notifications"
  consumer_group: "workers"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"      
  chat_ids:
    - 123456789
  timeout_seconds: 30

sse:
  heartbeat_seconds: 30

worker:
  concurrency: 5
  retry_attempts: 3
  retry_delay_seconds: 5
